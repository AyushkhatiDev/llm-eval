name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests + scorer regression gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      # The eval tool's own regression gate. The scorer is measured against the
      # hand-labelled development set and, separately, against a held-out set
      # authored after the rules were frozen. The build fails if either drops
      # more than 2 points below its committed baseline. Offline — no API key.
      - name: Scorer gate (development set)
        run: python scripts/validate_scorer.py --tolerance 0.02

      - name: Scorer gate (held-out set)
        run: python scripts/validate_scorer.py --held-out --tolerance 0.02

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://llm-eval-55pg.onrender.com/api
